[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "navila-agno-demo"
version = "0.1.0"
description = "NaVILA x Agno Supervisor-Executor navigation demo"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
agno = ["agno>=2.9.0,<3.0"]
lightnav = ["websockets>=12"]
bridge = ["fastapi>=0.110", "uvicorn>=0.30"]
